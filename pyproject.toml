[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlg-side-project"
version = "0.1.0"
description = "Reproducible Lorentzian EPRL amplitude and cutoff studies"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4"]

[project.scripts]
qlg = "qlg.cli:main"

[tool.setuptools.packages.find]
include = ["qlg*"]

[tool.setuptools.package-data]
qlg = ["reference/*.tsv", "reference/*.json"]
