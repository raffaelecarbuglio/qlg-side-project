name: Numerical checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: make test
      - run: python -m qlg estimate configs/benchmark.json
      - run: python -m qlg refinement-plan --steps 2
